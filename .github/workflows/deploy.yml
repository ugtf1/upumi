name: UPUMI CI/CD to Cloud Run (web + api) - path filtered

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

env:
  PROJECT_ID: top-cedar-471512-k3
  PROJECT_NUMBER: 30228073381
  REGION: us-east1

  WEB_SERVICE_NAME: upumi
  API_SERVICE_NAME: upumi-api

jobs:
  # 1) Build + Deploy WEB unconditionally on push to master or main
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    outputs:
      web_url: ${{ steps.urls.outputs.web_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/ugtf-github-pool/providers/github-actions
          service_account: github-runner-ugtf@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          retries: "3"
          backoff: "250"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and Push WEB Docker Image
        id: build_web
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.WEB_SERVICE_NAME }}/${{ env.WEB_SERVICE_NAME }}:${{ github.sha }}"
          API_URL=$(gcloud run services describe ${{ env.API_SERVICE_NAME }} --region ${{ env.REGION }} --format='value(status.url)' || true)
          if [ -z "$API_URL" ]; then
            echo "API service URL not found; using relative /api"
            API_BASE="/api"
          else
            API_BASE="${API_URL}/api"
          fi
          echo "Building WEB image: $IMAGE_TAG"
          echo "Using VITE_API_BASE=$API_BASE"
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build --build-arg VITE_API_BASE="$API_BASE" -t "$IMAGE_TAG" ./web
          docker push "$IMAGE_TAG"
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy WEB to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.WEB_SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ steps.build_web.outputs.image }}
          wait: true

      - name: Fetch WEB URL
        id: urls
        run: |
          WEB_URL=$(gcloud run services describe ${{ env.WEB_SERVICE_NAME }} --region ${{ env.REGION }} --format='value(status.url)')
          echo "web_url=$WEB_URL" >> $GITHUB_OUTPUT
          echo "WEB URL: $WEB_URL"

  # 1) Build + Push API image
  build-api-image:
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    outputs:
      image: ${{ steps.build_api.outputs.image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/ugtf-github-pool/providers/github-actions
          service_account: github-runner-ugtf@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          retries: "3"
          backoff: "250"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Build and Push API Docker Image
        id: build_api
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.API_SERVICE_NAME }}/${{ env.API_SERVICE_NAME }}:${{ github.sha }}"
          echo "Building API image: $IMAGE_TAG"
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
          docker build -t "$IMAGE_TAG" ./services/upumi-backend

          echo "Smoke-testing API container on /health..."
          CID=$(docker run -d \
            -p 18080:8080 \
            -e PORT=8080 \
            -e JWT_SECRET=ci-smoke-test-secret \
            -e SKIP_MIGRATIONS=true \
            -e DATABASE_URL='postgresql://ci:ci@127.0.0.1:5432/upumi?schema=public' \
            "$IMAGE_TAG")

          cleanup() {
            docker rm -f "$CID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:18080/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ API container smoke test passed"
              break
            fi
            if [ "$i" = "12" ]; then
              echo "❌ API container smoke test failed"
              docker ps -a --filter "id=$CID" || true
              docker logs "$CID" || true
              exit 1
            fi
            sleep 2
          done

          docker push "$IMAGE_TAG"
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

  # 1b) Run safe Prisma migrations before deploying API
  migrate-database:
    needs: [build-api-image]
    if: needs.build-api-image.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME || 'top-cedar-471512-k3:us-east1:upumi-postgres' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        run: npm ci
        working-directory: services/upumi-backend

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/ugtf-github-pool/providers/github-actions
          service_account: github-runner-ugtf@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          retries: "3"
          backoff: "250"

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.23.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$CLOUD_SQL_CONNECTION_NAME" &
          echo $! > cloud-sql-proxy.pid
          sleep 5

      - name: Export DATABASE_URL
        run: |
          export RAW_URL=$(gcloud secrets versions access latest --secret=UPUMI_DATABASE_URL)
          python -c "
          import os, urllib.parse
          url = os.environ.get('RAW_URL', '')
          if not url:
              print('Failed to get secret from Secret Manager')
              exit(1)
          parsed = urllib.parse.urlparse(url)
          # Remove any 'host' query parameter to prevent unix socket overriding TCP
          qs = urllib.parse.parse_qs(parsed.query)
          qs.pop('host', None)
          new_query = urllib.parse.urlencode(qs, doseq=True)
          new_url = parsed._replace(netloc=f'{parsed.username}:{parsed.password}@127.0.0.1:5432', query=new_query).geturl()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'DATABASE_URL={new_url}\n')
          "

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: services/upumi-backend

  # 1c) Deploy API service
  deploy-api:
    needs: [build-api-image, migrate-database]
    if: needs.build-api-image.result == 'success' && needs.migrate-database.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    outputs:
      api_url: ${{ steps.urls.outputs.api_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/ugtf-github-pool/providers/github-actions
          service_account: github-runner-ugtf@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          retries: "3"
          backoff: "250"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy API to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.API_SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ needs.build-api-image.outputs.image }}
          flags: >
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:upumi-postgres
            --no-invoker-iam-check
            --set-env-vars=NODE_ENV=production
            --set-secrets=DATABASE_URL=UPUMI_DATABASE_URL:latest,JWT_SECRET=UPUMI_JWT_SECRET:latest,ADMIN_BOOTSTRAP_SECRET=UPUMI_ADMIN_BOOTSTRAP_SECRET:latest,CORS_ORIGIN=UPUMI_CORS_ORIGIN:latest
            --set-secrets=GOOGLE_SHEET_URL=UPUMI_GOOGLE_SHEET_URL:latest,GOOGLE_SHEET_GID=UPUMI_GOOGLE_SHEET_GID:latest,GOOGLE_SHEET_YEAR=UPUMI_GOOGLE_SHEET_YEAR:latest,SCHEDULER_IMPORT_SECRET=UPUMI_SCHEDULER_IMPORT_SECRET:latest
          wait: true

      - name: Fetch API URL
        id: urls
        run: |
          API_URL=$(gcloud run services describe ${{ env.API_SERVICE_NAME }} --region ${{ env.REGION }} --format='value(status.url)')
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "API URL: $API_URL"

  # 2) Health check WEB (only if web deployed)
  health-check-web:
    needs: deploy-web
    if: always() && needs.deploy-web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Health check WEB
        run: |
          WEB_URL="${{ needs.deploy-web.outputs.web_url }}"
          echo "Checking WEB at $WEB_URL..."
          for i in {1..12}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_URL")
            if [ "$STATUS" = "200" ]; then
              echo "✅ WEB healthy"
              exit 0
            fi
            echo "Waiting for WEB... status=$STATUS"
            sleep 5
          done
          echo "❌ WEB did not become healthy"
          exit 1

  # 2) Health check API (only if api deployed) - AUTHENTICATED (no public allUsers)
  health-check-api:
    needs: deploy-api
    if: always() && needs.deploy-api.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        id: auth
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/ugtf-github-pool/providers/github-actions
          service_account: github-runner-ugtf@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          token_format: "id_token"
          id_token_audience: "${{ needs.deploy-api.outputs.api_url }}"
          retries: "3"
          backoff: "250"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Health check API (/health) (authenticated)
        run: |
          API_URL="${{ needs.deploy-api.outputs.api_url }}"
          echo "Checking API at $API_URL/health (authenticated)..."

          for i in {1..12}; do
            TOKEN="${{ steps.auth.outputs.id_token }}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              "$API_URL/health")

            if [ "$STATUS" = "200" ]; then
              echo "✅ API healthy"
              exit 0
            fi

            echo "Waiting for API... status=$STATUS"
            sleep 5
          done

          echo "❌ API did not become healthy"
          exit 1

  # 3) Lighthouse (only if web changed + web healthy)
  lighthouse-audit:
    needs: [deploy-web, health-check-web]
    if: always() && needs.deploy-web.result == 'success' && needs.health-check-web.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      lighthouse_summary: ${{ steps.summary.outputs.lighthouse_summary }}
    steps:
      - name: Install Lighthouse CI + jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse (Desktop + Mobile)
        run: |
          WEB_URL="${{ needs.deploy-web.outputs.web_url }}"
          mkdir -p .lighthouseci

          echo "🏁 Desktop..."
          lhci collect \
            --url="$WEB_URL" \
            --numberOfRuns=1 \
            --settings.formFactor=desktop \
            --settings.screenEmulation.mobile=false \
            --settings.throttlingMethod=provided || true

          DESKTOP_REPORT=$(find .lighthouseci -name "lhr-*.json" | sort | tail -n 1)
          if [ -n "$DESKTOP_REPORT" ]; then
            cp "$DESKTOP_REPORT" ./lighthouse-desktop.json
          else
            echo "Desktop Lighthouse audit failed; no report was generated."
          fi

          echo "📱 Mobile..."
          lhci collect \
            --url="$WEB_URL" \
            --numberOfRuns=1 \
            --settings.formFactor=mobile \
            --settings.throttlingMethod=simulate || true

          MOBILE_REPORT=$(find .lighthouseci -name "lhr-*.json" | sort | tail -n 1)
          if [ -n "$MOBILE_REPORT" ]; then
            cp "$MOBILE_REPORT" ./lighthouse-mobile.json
          else
            echo "Mobile Lighthouse audit failed; no report was generated."
          fi

      - name: Extract Lighthouse Scores
        id: summary
        run: |
          get_score() { jq -r ".categories.$1.score" "$2"; }

          extract_summary() {
            REPORT="$1"; DEVICE="$2"
            PERF=$(get_score performance $REPORT)
            ACCESS=$(get_score accessibility $REPORT)
            BEST=$(jq -r '.categories["best-practices"].score' $REPORT)
            SEO=$(get_score seo $REPORT)
            LCP=$(jq -r '.audits["largest-contentful-paint"].numericValue' $REPORT)
            CLS=$(jq -r '.audits["cumulative-layout-shift"].numericValue' $REPORT)
            TBT=$(jq -r '.audits["total-blocking-time"].numericValue' $REPORT)
            echo "${DEVICE}: Performance=${PERF}, Accessibility=${ACCESS}, BestPractices=${BEST}, SEO=${SEO}, LCP=${LCP}ms, CLS=${CLS}, TBT=${TBT}ms"
          }

          DESKTOP_SUMMARY=$(extract_summary lighthouse-desktop.json "🖥️ Desktop")
          MOBILE_SUMMARY=$(extract_summary lighthouse-mobile.json "📱 Mobile")

          SUMMARY="Lighthouse Results:\n$DESKTOP_SUMMARY\n$MOBILE_SUMMARY"
          SUMMARY_ESCAPED=$(echo "$SUMMARY" | tr '\n' ' ' | tr -d '\r')
          echo "lighthouse_summary=$SUMMARY_ESCAPED" >> $GITHUB_OUTPUT

  # 4) Python SEO Audit (only if web changed + web healthy)
  seo-audit:
    needs: [deploy-web, health-check-web]
    if: always() && needs.deploy-web.result == 'success' && needs.health-check-web.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      issues_summary: ${{ steps.summary.outputs.issues_summary }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run SEO Audit
        run: |
          python - <<'EOF'
          import requests, json
          from bs4 import BeautifulSoup

          url = "${{ needs.deploy-web.outputs.web_url }}"
          resp = requests.get(url, timeout=20)
          soup = BeautifulSoup(resp.text, "lxml")

          issues = []
          if not soup.title or not soup.title.string or not soup.title.string.strip():
              issues.append("Missing <title>")
          if not soup.find("meta", attrs={"name": "description"}):
              issues.append("Missing meta description")
          if not soup.find("h1"):
              issues.append("Missing <h1> tag")

          report = {"url": url, "issues": issues, "total_issues": len(issues)}
          with open("seo-results.json", "w") as f:
              json.dump(report, f, indent=2)
          print(f"SEO issues: {len(issues)}")
          EOF

      - name: Generate SEO Summary
        id: summary
        run: |
          SUMMARY=$(python -c 'import json; d=json.load(open("seo-results.json")); i=d.get("issues",[]); print(", ".join(i[:5]) if i else "No issues detected")')
          echo "issues_summary=$SUMMARY" >> $GITHUB_OUTPUT

  # 5) Notify via Email
  notify:
    needs: [deploy-web, build-api-image, migrate-database, deploy-api, health-check-web, health-check-api, lighthouse-audit, seo-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Email Summary
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "🚀 UPUMI Deploy Report (path-filtered)"
          to: ono@ugtf.org
          from: UGTF CI Bot
          body: |
            ✅ Deployment pipeline finished

            WEB:
              - deploy: ${{ needs.deploy-web.result }}
              - health: ${{ needs.health-check-web.result }}
              - url: ${{ needs.deploy-web.outputs.web_url || 'skipped' }}

            API:
              - image: ${{ needs.build-api-image.result }}
              - migration: ${{ needs.migrate-database.result }}
              - deploy: ${{ needs.deploy-api.result }}
              - health: ${{ needs.health-check-api.result }}
              - url: ${{ needs.deploy-api.outputs.api_url || 'skipped' }}

            📊 Lighthouse (WEB):
              ${{ needs.lighthouse-audit.outputs.lighthouse_summary || 'skipped' }}

            🧩 SEO (WEB):
              ${{ needs.seo-audit.outputs.issues_summary || 'skipped' }}
# Trigger deploy
