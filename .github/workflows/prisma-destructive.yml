name: Prisma Cloud SQL Migrations

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      CLOUD_SQL_CONNECTION_NAME: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci
        working-directory: services/upumi-backend

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -fsSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.23.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 "$CLOUD_SQL_CONNECTION_NAME" &
          echo $! > cloud-sql-proxy.pid

      - name: Wait for proxy
        run: sleep 4

      - name: Export DATABASE_URL
        run: |
          export RAW_URL=$(gcloud secrets versions access latest --secret=UPUMI_DATABASE_URL)
          python -c "
          import os, urllib.parse
          url = os.environ.get('RAW_URL', '')
          if not url:
              print('Failed to get secret from Secret Manager')
              exit(1)
          parsed = urllib.parse.urlparse(url)
          qs = urllib.parse.parse_qs(parsed.query)
          qs.pop('host', None)
          new_query = urllib.parse.urlencode(qs, doseq=True)
          new_url = parsed._replace(netloc=f'{parsed.username}:{parsed.password}@127.0.0.1:5432', query=new_query).geturl()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'DATABASE_URL={new_url}\n')
          "

      - name: Verify Prisma schema file exists
        run: test -f services/upumi-backend/prisma/schema.prisma

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: services/upumi-backend
